<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Summary</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Student Details</h1>
  <p><strong>Name:</strong> <span id="name"></span></p>
  <p><strong>Email:</strong> <span id="email"></span></p>
  <p><strong>Gender:</strong> <span id="gender"></span></p>
  <p><strong>Course:</strong> <span id="course"></span></p>
  <p><strong>Hobbies:</strong> <span id="hobbies"></span></p>

  <button onclick="window.location.href='form.html'">Back</button>

  <script>
    document.getElementById("name").textContent = localStorage.getItem("Name");
    document.getElementById("email").textContent = localStorage.getItem("Email");
    document.getElementById("gender").textContent = localStorage.getItem("Gender");
    document.getElementById("course").textContent = localStorage.getItem("Course");

    const hobbies = JSON.parse(localStorage.getItem("Hobbies")) || [];
    document.getElementById("hobbies").textContent = hobbies.length ? hobbies.join(", ") : "None";
  </script>
</body>
</html>
