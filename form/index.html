<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Survey Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="stu-container">
        <h1>STUDENT SURVEY FORM</h1>
        <form id="stuform">
            <!-- Name -->
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="Name Here!!" required pattern="[A-Za-z\s]{2,}" title="Only alphabets allowed">
            <span class="error-message" id="name-error">Invalid name</span>
            <span class="success-message" id="name-success">✔</span>

            <!-- Email -->
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Email Here!!" required pattern="[a-zA-Z0-9._%+-]+@[a-zA-Z0-9.-]+\.(com|edu|in)$" title="Email must end with .com, .edu or .in">
            <span class="error-message" id="email-error">Invalid email</span>
            <span class="success-message" id="email-success">✔</span>

            <!-- Password -->
            <label for="pass">Password:</label>
            <input type="password" id="pass" name="pass" placeholder="Password Here!" required pattern="^(?=.*[0-9]).{6,}$" title="Min 6 chars, at least one number">
            <span class="error-message" id="pass-error">Invalid password</span>
            <span class="success-message" id="pass-success">✔</span>

            <!-- Mobile -->
            <label for="mobno">Mobile Number:</label>
            <input type="text" id="mobno" name="mobno" placeholder="10-digit number" required pattern="[0-9]{10}">
            <span class="error-message" id="mob-error">Invalid mobile number</span>
            <span class="success-message" id="mob-success">✔</span>

            <!-- Date of Birth -->
            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob" required>
            <span class="error-message" id="dob-error">Please select date</span>
            <span class="success-message" id="dob-success">✔</span>

            <!-- Rating -->
            <label>Rating:</label>
            <input type="radio" name="rate" value="1">⭐1
            <input type="radio" name="rate" value="2">⭐2
            <input type="radio" name="rate" value="3">⭐3
            <input type="radio" name="rate" value="4">⭐4
            <input type="radio" name="rate" value="5">⭐5
            <span class="error-message" id="rate-error">Select rating</span>
            <span class="success-message" id="rate-success">✔</span>

            <!-- Interests -->
            <label>Interests:</label>
            <input type="checkbox" name="interest" value="Sports">Sports
            <input type="checkbox" name="interest" value="Music">Music
            <input type="checkbox" name="interest" value="Coding">Coding
            <input type="checkbox" name="interest" value="Reading">Reading
            <input type="checkbox" name="interest" value="Travel">Travel
            <span class="error-message" id="interest-error">Select at least one interest</span>
            <span class="success-message" id="interest-success">✔</span>

            <!-- Buttons -->
            <input type="submit" value="Submit">
            <input type="reset" value="Reset">
            <button type="button" id="display-btn">Display</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
